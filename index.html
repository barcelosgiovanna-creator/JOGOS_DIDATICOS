<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obra Equilibrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: canteiro em duas mesas — prancha técnica fixa à esquerda (casa em corte + balanço + carimbo), mesa de decisão à direita (etapas e cards) */
:root{
  --paper:#E8EBE6; --sheet:#F6F7F3; --grid:#E0E4DD; --ink:#1B2220; --ink-2:#4F5954; --ink-3:#88918C; --line:#C7CDC6;
  --accent:#F2B705; --accent-ink:#1B2220;
  --warn:#A9401A; --warn-bg:#F6E3D8; --good:#2A7347; --good-bg:#DDEDE2;
  --p1:#D99A00; --p2:#2F6FB0; --p3:#C24E3A; --p4:#2E8A62;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* materiais do desenho */
  --soil:#CDBB98; --soil-line:#A38F69; --mortar:#E4E0D5; --stain:#6F7D55;
  --conc:#A9ADA6; --conc-d:#8D928B; --steel:#4D5A65; --wood:#A6713C; --alu:#B7BEC2; --pvcw:#F5F6F2;
  --brick:#B3543B; --ceram:#C6774C; --block:#A1A59D; --eco:#BC895D; --eps:#EEF0EC; --drywall:#DCDDD5;
  --tile:#B45A36; --shingle:#40474C; --fibro:#A3A9A5; --metal:#7D8B95; --green:#57873A; --pv:#22364B;
  --glass:#A3D1DF; --water:#3A80B6; --hot:#C8432E; --sewer:#7A5B3A;
  --imp-b:#2A2622; --imp-p:#8C918B; --imp-m:#36312B; --imp-l:#4D7EA1;
  --f-pva:#ECE7DC; --f-acril:#CFDFD5; --f-text:#D8C8A8; --f-epoxi:#C5D5DC; --f-ceram:#F1F2EE; --f-porc:#D4CEC2;
  --fl-polido:#9DA19A; --fl-epoxi:#5E8695; --fl-ceram:#C4865C; --fl-porc:#D7D0C3; --fl-vinil:#9A7752; --fl-madeira:#87562A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111614; --sheet:#181E1C; --grid:#1E2523; --ink:#E3E8E4; --ink-2:#A3ADA8; --ink-3:#6E7874; --line:#2D3633;
    --accent:#F2B705; --accent-ink:#141816;
    --warn:#F08B52; --warn-bg:#3A2216; --good:#62C48F; --good-bg:#16301F;
    --p1:#F2B705; --p2:#6EA8E0; --p3:#EB8470; --p4:#5CC08A;
    --soil:#4A4131; --soil-line:#6A5D45; --mortar:#4A504A; --stain:#9AAA78;
    --conc:#7B8079; --conc-d:#656A63; --steel:#7F8E9A; --wood:#A57447; --alu:#99A1A5; --pvcw:#CDD1CC;
    --brick:#A8523B; --ceram:#B26D47; --block:#868B83; --eco:#A77B55; --eps:#C6CBC5; --drywall:#B2B5AC;
    --tile:#A75639; --shingle:#5C656B; --fibro:#878D89; --metal:#8E9BA4; --green:#5F9C3D; --pv:#3A5A7C;
    --glass:#4F8FA4; --water:#4E98D0; --hot:#E26B53; --sewer:#9C7B56;
    --imp-b:#0F0D0B; --imp-p:#6C716B; --imp-m:#1F1B17; --imp-l:#5F96BB;
    --f-pva:#B9B3A7; --f-acril:#94A89C; --f-text:#A69575; --f-epoxi:#8FA3AC; --f-ceram:#C4C8C2; --f-porc:#A69F93;
    --fl-polido:#7C807A; --fl-epoxi:#4F7887; --fl-ceram:#A86E4A; --fl-porc:#ADA597; --fl-vinil:#86663F; --fl-madeira:#7A4C24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111614; --sheet:#181E1C; --grid:#1E2523; --ink:#E3E8E4; --ink-2:#A3ADA8; --ink-3:#6E7874; --line:#2D3633;
  --accent:#F2B705; --accent-ink:#141816;
  --warn:#F08B52; --warn-bg:#3A2216; --good:#62C48F; --good-bg:#16301F;
  --p1:#F2B705; --p2:#6EA8E0; --p3:#EB8470; --p4:#5CC08A;
  --soil:#4A4131; --soil-line:#6A5D45; --mortar:#4A504A; --stain:#9AAA78;
  --conc:#7B8079; --conc-d:#656A63; --steel:#7F8E9A; --wood:#A57447; --alu:#99A1A5; --pvcw:#CDD1CC;
  --brick:#A8523B; --ceram:#B26D47; --block:#868B83; --eco:#A77B55; --eps:#C6CBC5; --drywall:#B2B5AC;
  --tile:#A75639; --shingle:#5C656B; --fibro:#878D89; --metal:#8E9BA4; --green:#5F9C3D; --pv:#3A5A7C;
  --glass:#4F8FA4; --water:#4E98D0; --hot:#E26B53; --sewer:#9C7B56;
  --imp-b:#0F0D0B; --imp-p:#6C716B; --imp-m:#1F1B17; --imp-l:#5F96BB;
  --f-pva:#B9B3A7; --f-acril:#94A89C; --f-text:#A69575; --f-epoxi:#8FA3AC; --f-ceram:#C4C8C2; --f-porc:#A69F93;
  --fl-polido:#7C807A; --fl-epoxi:#4F7887; --fl-ceram:#A86E4A; --fl-porc:#ADA597; --fl-vinil:#86663F; --fl-madeira:#7A4C24;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
.app{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:3px;flex:none;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--ink) 6px 12px)}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:27px;letter-spacing:.03em;text-transform:uppercase;line-height:1;margin:0}
.brand small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.players{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.scen-chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:6px 10px;border:1px dashed var(--ink-3);border-radius:4px}
.pchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px 5px 9px;font-weight:500;font-size:14px;cursor:pointer}
.pchip .dot,.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;display:inline-block}
.pchip b{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pchip.turn{border-color:var(--ink)}
.pchip.viewing{box-shadow:0 0 0 2px var(--accent)}
.pchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* grade principal */
.layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.45fr);gap:28px;align-items:start}
.board{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px;min-width:0}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bh b{font-family:var(--font-display);font-size:20px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.sheet{background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:4px;padding:8px}
.sheet svg{display:block;width:100%;height:auto;max-height:52vh;margin:0 auto}
.t-title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;fill:var(--ink)}
.t-sm{font-family:var(--font-mono);font-size:7px;fill:var(--ink-2)}
.ghost *{fill:none;stroke:var(--ink-3);stroke-width:.8;stroke-dasharray:4 3}
.lay rect,.lay polygon,.lay circle{stroke:var(--ink);stroke-width:.6}
.lay .nos{stroke:none}
.lay.prev{opacity:.62;animation:pulse 1.6s ease-in-out infinite}
.lay.fresh{animation:solid .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes pulse{50%{opacity:.32}}
@keyframes solid{from{opacity:0;filter:blur(3px);transform:translateY(5px)}to{opacity:1;filter:none;transform:none}}

.bal{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:7px}
.bal-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:2px}
.bal-h .nota{font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.bal-h .verdict{font-size:13px;color:var(--ink-2);text-align:right}
.brow{display:grid;grid-template-columns:118px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.brow span{color:var(--ink-2)}
.btrack{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--ink-2);transition:width .5s}
.btrack.lo i{background:var(--warn)} .btrack.hi i{background:var(--good)}
.brow b{font-family:var(--font-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

.stamp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);font-family:var(--font-mono);font-size:11px}
.stamp div{background:var(--sheet);padding:5px 8px;min-width:0}
.stamp span{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stamp b{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.3}

/* mesa de decisão */
.desk{min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px}
.hero{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,4.4vw,50px);line-height:1;text-transform:uppercase;letter-spacing:.01em;margin:0 0 12px;text-wrap:balance;max-width:18ch}
.h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.6vw,42px);line-height:1;text-transform:uppercase;margin:0 0 8px;text-wrap:balance}
.lede{max-width:62ch;color:var(--ink-2);margin:0}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px}
.stage-head > div:first-child{min-width:0;flex:1 1 320px}
.turn{display:flex;align-items:center;gap:9px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);font-size:13px;color:var(--ink-2)}
.turn b{font-family:var(--font-display);font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.steps{list-style:none;padding:0;margin:18px 0 12px;display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:3px}
.steps span{display:block;height:5px;background:var(--line);border-radius:1px}
.steps .done span{background:var(--ink-2)} .steps .cur span{background:var(--accent)}
.steps em{display:none;font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:4px;white-space:nowrap}
.steps .cur em{display:block;color:var(--ink);font-weight:500;overflow:visible}
.legend{font-size:13px;color:var(--ink-2);margin:0 0 14px;max-width:84ch}
.legend b{color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0}
.card:hover{border-color:var(--ink-3)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h4{margin:0;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 6px;border-radius:3px;flex:none}
.cd{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.idx{display:grid;gap:5px}
.ir{display:grid;grid-template-columns:104px minmax(0,1fr) 42px;align-items:center;gap:8px;font-size:12.5px}
.il{color:var(--ink-2)}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:9px}
.meter i{background:var(--line);border-radius:1px}
.meter.hi i.on{background:var(--good)} .meter.mid i.on{background:var(--ink-2)} .meter.lo i.on{background:var(--warn)}
.iv{font-family:var(--font-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.iv s{color:var(--ink-3);font-weight:400;margin-right:3px}
.na{font-size:11.5px;color:var(--ink-3);font-style:italic}
.notes{margin-top:auto;display:grid;gap:6px}
.note{margin:0;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;background:var(--paper);color:var(--ink-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.good{background:var(--good-bg);color:var(--good)}
.note .src{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;font-weight:500}
.confirm{position:sticky;bottom:0;margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:5}
.confirm b{font-family:var(--font-display);font-size:21px;font-weight:600;text-transform:uppercase}
.muted{color:var(--ink-2);font-size:14px}
.btn{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:10px 20px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* configuração */
.block{margin-top:26px}
.block h3{font-family:var(--font-display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.hint{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;max-width:62ch}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font-family:var(--font-mono);font-weight:500;font-size:16px;padding:8px 18px;background:var(--sheet);border:0;border-right:1px solid var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.names label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.names label span{display:flex;align-items:center;gap:6px}
input[type="text"]{font:500 15px var(--font-body);padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink);width:100%}
input[type="text"]:focus{outline:2px solid var(--accent);border-color:var(--ink)}
.scens{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.scen{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.scen:hover{border-color:var(--ink-3)}
.scen[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.scen:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scen b{font-family:var(--font-display);font-size:19px;text-transform:uppercase;font-weight:600;line-height:1.1}
.scen span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.scen p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.4}
.rules dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:0}
.rules dl div{border-top:2px solid var(--ink);padding-top:6px}
.rules dt{font-family:var(--font-display);font-size:18px;font-weight:600;text-transform:uppercase}
.rules dd{margin:0;font-size:13px;color:var(--ink-2)}
.formula{margin-top:14px;font-family:var(--font-mono);font-size:13.5px;background:var(--sheet);border:1px dashed var(--ink-3);border-radius:4px;padding:10px 12px;max-width:70ch}
.formula p{margin:6px 0 0;font-family:var(--font-body);font-size:13.5px;color:var(--ink-2)}
.actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}

/* vistoria final */
.rank{display:grid;gap:8px;margin-top:18px}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.rrow.first{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pos{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1}
.rname{font-family:var(--font-display);font-size:23px;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.1;overflow-wrap:anywhere}
.rsub{font-size:12.5px;color:var(--ink-2)}
.rscore{text-align:right}
.rscore b{font-family:var(--font-mono);font-size:30px;font-weight:500;display:block;line-height:1;font-variant-numeric:tabular-nums}
.rscore span{font-size:12px;color:var(--ink-2)}
.endgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin-top:14px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel h3{font-family:var(--font-display);font-size:19px;font-weight:600;text-transform:uppercase;margin:0 0 8px}
.radar svg{width:100%;height:auto;max-width:360px;display:block;margin:0 auto}
.radar text{font-family:var(--font-mono);font-size:10px;fill:var(--ink-2)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;margin-top:6px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.feedback p{margin:0 0 8px;font-size:14px;max-width:68ch}
.feedback p:last-child{margin-bottom:0}
.memo{margin-top:12px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.memo summary{cursor:pointer;font-family:var(--font-display);font-size:19px;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px}
.memo summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tbl{overflow-x:auto;margin-top:10px}
.cmp td.pc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.cmp .pbar{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden;min-width:60px}
.cmp .pbar em{display:block;height:100%;background:var(--accent)}
.cmp td.alt{color:var(--ink-3);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.lo{color:var(--warn)} td.hi{color:var(--good)}
tfoot td{font-weight:600;border-bottom:0;border-top:1.5px solid var(--ink)}

.layout.solo{grid-template-columns:1fr}

.lobby{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lobby span{padding:4px 10px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;font-size:13px;overflow-wrap:anywhere}
.rc-big{font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:.14em;color:var(--ink);line-height:1.1}
.codebox{display:grid;gap:8px;margin-top:10px}

<script>
/* ---------- dados ---------- */
const IDX=[
  {k:'p',n:'Preço',h:'10 = mais barato'},
  {k:'t',n:'Tempo',h:'10 = mais rápido'},
  {k:'d',n:'Durabilidade',h:'10 = dura mais'},
  {k:'m',n:'Manutenção',h:'10 = quase não exige'},
  {k:'e',n:'Estética',h:'10 = mais bonito'}
];
const O=(id,name,desc,v,note,alert)=>({id,name,desc,v,note,alert:!!alert});
const _=null;
const STAGES=[
 {id:'brief',name:'Briefing com o cliente',short:'Briefing',desc:'O primeiro passo do projeto: entender o que o cliente quer, quanto pode gastar e em quanto tempo. Um briefing mal feito vira mudança de projeto no meio da obra.',opts:[
  O('briefcompleto','Briefing estruturado + programa de necessidades','Reuniões, questionário, visita ao lote, programa de necessidades, orçamento-alvo e prazo aprovados e assinados pelo cliente.',[7,6,9,9,9],'Leva mais tempo no começo, mas cada decisão de projeto tem uma referência combinada. Mudanças depois viram aditivo de contrato.'),
  O('briefinformal','Conversa informal anotada','Uma reunião com o cliente e anotações soltas sobre cômodos e gosto.',[9,9,6,6,6],'Rápido, mas deixa lacunas: orçamento, prazo e prioridades ficam implícitos.'),
  O('semBrief','Sem briefing','O projetista parte de uma planta padrão e o cliente vê o resultado depois.',[10,10,4,4,2],'O cliente só descobre o que queria quando a casa já está de pé. Prepare-se para pedidos de mudança.',true)
 ]},
 {id:'sond',name:'Topografia e sondagem',short:'Sondagem',desc:'Antes de projetar: levantamento topográfico e investigação do solo. O solo do seu lote foi sorteado e só a sondagem mostra o que há embaixo. Não se vê depois de pronto: estética não se aplica.',opts:[
  O('spt','SPT + topografia','Levantamento planialtimétrico e sondagem à percussão: amostrador cravado por martelo de 65 kg caindo de 75 cm.',[7,7,9,9,_],'Revela o tipo de solo, o índice N a cada metro e o nível d’água (NBR 6484). Mínimo de 2 furos para a área da casa (NBR 8036).'),
  O('sptmin','Um furo de SPT + topografia','Levantamento topográfico e um único furo de sondagem, abaixo do mínimo da norma.',[8,8,6,7,_],'Mostra o perfil num ponto só: variações do solo dentro do lote podem passar despercebidas.'),
  O('visual','Só inspeção visual','Sem sondagem e sem levantamento topográfico: o terreno é avaliado no olho.',[10,10,2,3,_],'Erro comum: avaliar o solo só visualmente. Você não vai saber o que há abaixo da superfície nem os desníveis exatos do lote.',true),
  O('completo','SPT + topografia + laudo de vizinhança','Sondagem, levantamento planialtimétrico e laudo de vistoria dos vizinhos registrado em cartório.',[5,6,10,10,_],'O laudo, feito antes da terraplenagem e das fundações, protege o construtor e os vizinhos.')
 ]},
 {id:'proj',name:'Elaboração de projetos',short:'Projetos',desc:'Arquitetura e projetos complementares (estrutura, elétrica, hidrossanitário). A forma de projetar define a compatibilização entre disciplinas e como sai a lista de materiais. Estética mede o quanto o cliente consegue enxergar a casa antes de construir.',opts:[
  O('cad','Elaborou em CAD 2D','Plantas, cortes e fachadas desenhados em linhas, uma prancha por disciplina.',[8,6,6,7,5],'Ferramenta difundida e barata. A compatibilização é feita sobrepondo pranchas e os quantitativos são levantados à mão.'),
  O('3d','Elaborou em 3D, sem informar os parâmetros dos objetos','Modelo tridimensional com boa imagem, mas cada parede, laje e tubo é só geometria.',[6,6,6,7,9],'O cliente visualiza bem a casa, mas os objetos não carregam material, dimensão nem custo: nada de quantitativo nem de detecção de interferências.',true),
  O('bim','Elaborou em BIM','Modelo com objetos parametrizados (material, dimensões, custo) e disciplinas integradas.',[5,7,9,9,8],'Facilitou a extração de quantitativos e a detecção de interferências entre estrutura e instalações antes da obra. Exige software e equipe capacitada.')
 ]},
 {id:'cant',name:'Canteiro de obras',short:'Canteiro',desc:'O canteiro é a fábrica da construção civil. Nesta etapa, durabilidade e manutenção medem perdas de material, acidentes e retrabalho. Estética não se aplica.',opts:[
  O('planejado','Canteiro planejado por fase','Layout para as fases inicial, intermediária e final, com almoxarifado, estoques e áreas de vivência.',[6,8,9,8,_],'Transporte de material não agrega valor: um bom layout reduz deslocamentos, perdas e acidentes. Áreas de vivência pela NR 18.'),
  O('container','Contêineres alugados','Escritório, almoxarifado e vestiário em contêineres.',[6,9,7,8,_],'Montagem e desmontagem rápidas. Aluguel mensal pesa em obras longas.'),
  O('improvisado','Barracão improvisado','Barraco de madeira montado no lote, sem projeto de canteiro.',[9,7,4,4,_],'Sem lugar certo para estocar: cimento no chão empedra e blocos quebram no manuseio.',true),
  O('minimo','Material na calçada','Sem barracão: material descarregado na rua e usado conforme chega.',[10,6,2,3,_],'Descumpre a NR 18 (sanitário, vestiário, refeitório) e multiplica perdas, furtos e acidentes.',true)
 ]},
 {id:'terra',name:'Movimento de terra e contenção',short:'Terra',desc:'Deixar o terreno na cota de projeto, conter desníveis e locar a obra. Erros aqui viram recalques e trincas lá na frente. Estética não se aplica.',opts:[
  O('locacao','Limpeza e locação com gabarito','Terreno já plano: limpeza, gabarito de pontaletes e marcação dos eixos.',[9,9,8,9,_],'Pontaletes a no máximo 2 m, esquadro 3-4-5 e referência de nível (RN) fixa. Só serve se o lote já estiver plano.'),
  O('corte','Corte e aterro compactado','Seção mista: o solo do corte vira aterro, compactado em camadas.',[7,6,8,8,_],'Camadas de até 20 cm, umedecidas e compactadas. Aterro acima de 1 m de altura exige controle tecnológico (NBR 5681).'),
  O('aterrosolto','Aterro lançado sem compactação','Terra despejada e espalhada para nivelar o lote.',[9,8,2,3,_],'Fundação direta sobre aterro mal compactado é causa clássica de recalque e fissuras em paredes.',true),
  O('arrimo','Corte + muro de arrimo de blocos','Contenção com blocos de concreto armados e drenagem.',[5,5,8,7,_],'A contenção mais comum e barata. Use blocos classe A e não esqueça drenagem e proteção superficial.'),
  O('gabiao','Corte + muro de gabião','Gaiolas de aço galvanizado preenchidas com pedras.',[5,6,8,8,_],'Drenante e flexível. Precisa de espaço e de pedra disponível perto da obra.')
 ]},
 {id:'fund',name:'Fundação',short:'Fundação',desc:'Transmite as cargas da casa térrea ao solo. A escolha depende da sondagem, das cargas, da vizinhança e do nível d’água (NBR 6122). Fica enterrada: estética não se aplica.',opts:[
  O('sapata','Sapata isolada','Fundação rasa de concreto armado sob cada pilar, ligada por vigas baldrame.',[8,6,8,9,_],'Dimensão mínima de 60 cm e lastro de concreto magro de 5 cm no fundo da cava. Para solo resistente até cerca de 3 m.'),
  O('radier','Radier','Laje de concreto armado que recebe a carga de todos os pilares.',[6,8,8,9,_],'Base de brita e lona, tela metálica e instalações embutidas antes da concretagem. Já serve de contrapiso.'),
  O('broca','Estaca broca','Estaca escavada com trado manual, Ø 20 a 30 cm, com bloco de coroamento.',[9,6,6,8,_],'Barata e comum em casas térreas. Poucos metros de profundidade e só acima do nível d’água.'),
  O('tubulao','Tubulão a céu aberto','Poço com Ø mínimo de 70 cm e base alargada, escavado com descida de operário.',[6,5,9,9,_],'Mobilização barata e sem vibração, e dispensa bloco sobre estacas. A base precisa ser inspecionada por engenheiro antes da concretagem.'),
  O('fpremold','Estaca pré-moldada cravada','Estacas de concreto industrializadas cravadas por percussão ou prensagem.',[5,7,9,9,_],'Controle por nega e repique em todas as estacas. Vibração e ruído afetam os vizinhos; evite em solo com matacões.'),
  O('helice','Estaca hélice contínua','Trado helicoidal com concreto bombeado pela haste, com monitoramento eletrônico.',[2,9,10,10,_],'Solução cara, com alto custo de mobilização e exigência de concreteira. Verifique se a sua obra realmente precisa dela (sondagem, cargas) e se há equipamento disponível na sua região.',true)
 ]},
 {id:'imp',name:'Impermeabilização do baldrame',short:'Baldrame',desc:'Barreira contra a umidade que sobe do solo pelas fundações e vigas baldrame (NBR 9575). Custa de 1 a 3% da obra; refazer pode custar de 10 a 15%.',opts:[
  O('impnada','Sem impermeabilização','Nenhuma barreira entre o baldrame e a alvenaria.',[10,10,1,1,_],'Economia que vira patologia: umidade por capilaridade, mofo, eflorescência e pintura descascando.',true),
  O('aditivo','Argamassa com aditivo','Aditivo impermeabilizante misturado à argamassa do baldrame.',[8,7,5,6,_],'Sistema rígido: reduz a porosidade, mas não acompanha fissuras da estrutura. Exige cura úmida de 72 h.'),
  O('betum','Pintura asfáltica a frio','Emulsão asfáltica aplicada em 5 a 7 demãos no baldrame.',[9,8,4,5,_],'Técnica usual para baldrames e blocos. Não resiste a sol, tráfego ou abrasão.'),
  O('polim','Argamassa polimérica','Cimento, agregados e polímeros aplicados em 2 a 4 demãos cruzadas.',[7,7,7,7,_],'Boa relação custo e desempenho para baldrame. Semiflexível: não acompanha fissuras grandes.'),
  O('manta','Manta asfáltica','Manta pré-fabricada aderida a maçarico sobre primer.',[4,5,9,8,_],'Muito durável, mas cara e trabalhosa para o baldrame de uma casa térrea.'),
  O('membrana','Membrana líquida (PU/acrílica)','Película elástica moldada no local, aplicada a frio.',[5,8,7,6,_],'Sem emendas e acompanha a movimentação. Depende da espessura aplicada.')
 ]},
 {id:'est',name:'Superestrutura',short:'Estrutura',desc:'Pilares, vigas e laje da casa térrea: o esqueleto que leva as cargas até a fundação.',opts:[
  O('concreto','Concreto armado moldado in loco','Fôrmas, armação e concretagem na obra (NBR 14931).',[6,4,9,8,6],'As fôrmas consomem boa parte do prazo da estrutura. Cura úmida por pelo menos 7 dias e reescoramento até 28 dias.'),
  O('metal','Estrutura metálica','Perfis de aço montados com solda ou parafusos.',[4,9,8,5,8],'Rápida, precisa e leve. Exige proteção contra corrosão (galvanização ou pintura), proteção contra fogo e plano de montagem.'),
  O('madeira','Madeira laminada (MLC)','Peças industrializadas de madeira de reflorestamento.',[5,8,5,3,10],'Exige tratamento contra cupim e umidade e madeira com origem certificada.'),
  O('alvest','Alvenaria estrutural','Blocos estruturais armados e grauteados: a parede é a estrutura.',[8,7,8,8,5],'Ótima para casa térrea. As paredes não podem ser removidas depois, o que limita reformas.'),
  O('lsf','Light steel frame','Perfis leves de aço galvanizado formando painéis.',[5,10,7,7,7],'Obra seca e muito rápida. Depende de mão de obra especializada.'),
  O('epremold','Pré-fabricado de concreto','Pilares e vigas feitos em fábrica e içados com guindaste (NBR 9062).',[5,8,9,9,4],'Controle de qualidade industrial e menos desperdício. Ligações são pontos críticos; exige acesso de caminhão e guindaste.')
 ]},
 {id:'ved',name:'Vedação vertical',short:'Vedação',desc:'Fecha os vãos e separa ambientes. Define conforto térmico e acústico e é onde mais aparecem fissuras (NBR 15575).',opts:[
  O('macico','Tijolo maciço','Tijolo cerâmico maciço assentado com argamassa.',[6,3,9,7,7],'Muita argamassa e execução lenta. Alta capacidade térmica e bom isolamento acústico.'),
  O('ceramico','Bloco cerâmico de vedação','Bloco furado classe VED, o mais usado no Brasil (NBR 15270).',[8,6,7,7,5],'Bloco VED não recebe carga estrutural. Encunhamento só depois de 7 dias da elevação; vergas passam 20 cm de cada lado do vão.'),
  O('bconc','Bloco de concreto','Bloco vazado de concreto, modular (NBR 6136).',[7,7,8,8,4],'Mais pesado e menos isolante que o cerâmico. Classe A para uso abaixo do nível do solo.'),
  O('celular','Concreto celular autoclavado','Bloco leve com células de ar fechadas (NBR 13438).',[6,7,7,7,6],'Leve, isolante termoacústico e bom contra incêndio. Não pode ser assentado úmido.'),
  O('eco','Tijolo ecológico (solo-cimento)','Tijolo prensado sem queima, com encaixe.',[7,7,7,7,8],'Menos argamassa e sem queima em forno. Pode ficar aparente com resina.'),
  O('eps','Painel de EPS','Painel de EPS com tela de aço e argamassa projetada.',[7,9,6,6,5],'Ótimo isolamento térmico. Fixar armários e cargas pesadas exige buchas específicas.'),
  O('drywall','Drywall','Gesso acartonado sobre perfis de aço.',[6,10,5,6,7],'Só para paredes internas. Em áreas molhadas, use placa RU (verde).')
 ]},
 {id:'cob',name:'Cobertura',short:'Cobertura',desc:'Protege da chuva e do sol. A escolha depende de clima, peso, isolamento, estética, custo, prazo e mão de obra disponível.',opts:[
  O('telhaceram','Telha cerâmica','Telhado de madeira com tesouras, terças, caibros e ripas.',[6,5,8,6,8],'Colonial: 26 un/m² e inclinação mínima de 25%. Francesa: 40%. Romana: 30%.'),
  O('telhaconc','Telha de concreto','Telha de cimento e agregados, colorida na massa (NBR 13859).',[6,6,8,7,7],'Resiste melhor ao litoral e ao granizo que a cerâmica, mas é mais pesada.'),
  O('fibro','Telha de fibrocimento','Telha ondulada leve sobre estrutura simples.',[10,8,5,5,2],'Inclinação mínima de 9% (5°) para a telha de 6 mm. Barata, mas esquenta muito sem forro.'),
  O('termo','Telha termoacústica','Telha metálica sanduíche com núcleo de EPS.',[5,9,8,8,6],'Isolamento térmico, montagem rápida, obra limpa e boa estanqueidade.'),
  O('laje','Laje impermeabilizada','Laje plana com platibanda e calha.',[4,4,7,4,8],'Visual moderno, mas depende totalmente da impermeabilização da cobertura. Platibanda sempre pede calha, rufos e pingadeiras.'),
  O('verde','Telhado verde','Laje com drenagem, substrato e vegetação.',[2,3,7,2,10],'Reduz calor e retém água de chuva. Mais carga na estrutura, manta antirraiz e manutenção constante.'),
  O('shingle','Telha shingle','Placas asfálticas com fibra de vidro sobre base contínua de OSB.',[3,7,8,7,9],'Visual sofisticado e leve. Exige base contínua e mão de obra treinada.')
 ]},
 {id:'ele',name:'Instalações elétricas',short:'Elétrica',desc:'Distribuição de energia, quadro e circuitos com proteção (NBR 5410). Instalações mal planejadas geram rasgos, retrabalho e superaquecimento.',opts:[
  O('embut','Embutida em conduíte','Eletroduto corrugado dentro das paredes e da laje.',[7,5,8,7,9],'Precisa ser planejada antes do reboco: mudar depois exige quebrar parede.'),
  O('aparente','Aparente em conduíte rígido','Eletroduto rígido e conduletes fixados na superfície.',[8,8,7,9,4],'Fácil de manter e ampliar. Visual industrial que não agrada a todos.'),
  O('aparentesolar','Aparente + energia solar','Instalação aparente com sistema fotovoltaico ligado à rede.',[4,7,8,8,5],'Conta de luz menor com instalação simples de manter. Exige projeto e homologação na distribuidora.'),
  O('solar','Embutida + energia solar','Instalação embutida com sistema fotovoltaico ligado à rede.',[2,5,9,7,8],'O investimento se paga em alguns anos. Exige projeto e homologação na distribuidora.'),
  O('auto','Embutida + automação','Iluminação e tomadas controladas por app e sensores.',[2,5,7,4,10],'Muito conforto, mas depende de rede, atualizações e técnico especializado.'),
  O('solarauto','Embutida + solar + automação','Casa inteligente com geração própria de energia.',[1,4,8,4,10],'O pacote mais completo e o mais caro. Mais sistemas significam mais coisas para manter.')
 ]},
 {id:'hid',name:'Instalações hidrossanitárias',short:'Hidro',desc:'Água fria e quente e destino do esgoto. Vazamentos e infiltrações são das patologias mais comuns. Ficam escondidas: estética não se aplica.',opts:[
  O('rede','Rede pública + PVC soldável','Ligação à concessionária e tubos de PVC embutidos em rasgos na alvenaria.',[8,7,7,7,_],'Lixar, limpar e aplicar adesivo nas juntas. Teste de estanqueidade antes de fechar os rasgos (NBR 5626).'),
  O('ppr','Tubulação PPR (termofusão)','Tubos de polipropileno unidos por termofusão, sem cola.',[6,7,9,9,_],'Juntas homogêneas e boa resistência à água quente.'),
  O('kitshaft','Shaft visitável + kits','Prumadas em shaft acessível e kits hidráulicos pré-montados.',[5,8,9,10,_],'Manutenção sem quebrar parede e menos interferência entre equipes.'),
  O('poco','Poço artesiano','Captação de água subterrânea com bomba submersa.',[3,4,7,5,_],'Exige outorga de uso de recursos hídricos (em Goiás, pela SEMAD) e análise de potabilidade. Só compensa sem rede pública ou com consumo alto.',true),
  O('fossa','Fossa séptica + sumidouro','Tratamento individual do esgoto no lote.',[7,6,6,3,_],'Dimensionada pelas NBR 7229 e 13969. Exige limpeza periódica do lodo.')
 ]},
 {id:'pluv',name:'Águas pluviais',short:'Pluvial',desc:'Calhas, condutores e destino da água de chuva (NBR 10844). Água pluvial nunca pode ir para a rede de esgoto. Estética não se aplica.',opts:[
  O('sarjeta','Calhas e condutores até a sarjeta','Sistema pluvial separado do esgoto, descarregando na via pública.',[8,8,8,7,_],'Solução correta e simples: calhas dimensionadas pela área de contribuição e condutores de no mínimo 75 mm.'),
  O('pluvesgoto','Chuva ligada no esgoto','Condutores do telhado ligados na caixa de esgoto.',[10,10,5,5,_],'É proibido: sobrecarrega a rede de esgoto e a estação de tratamento. Dá multa se a concessionária descobrir.',true),
  O('cisterna','Calhas + cisterna com extravasor','Captação para uso não potável, com excedente para a sarjeta.',[5,6,8,6,_],'Água para descarga, rega e lavagem. Exige descarte das primeiras águas e limpeza do reservatório.'),
  O('jardimchuva','Calhas + jardim de chuva','A água infiltra no próprio lote, num canteiro drenante.',[6,6,7,6,_],'Reduz a enxurrada na rua. Precisa de solo que infiltre e distância da fundação.'),
  O('semcalha','Sem calhas','A água cai direto do beiral no terreno.',[9,9,4,5,_],'Respinga nas paredes e encharca o solo junto à fundação.')
 ]},
 {id:'imp2',name:'Impermeabilização de áreas molhadas e cobertura',short:'Áreas mol.',desc:'Banheiros, cozinha, área de serviço, lajes e calhas. Toda superfície que recebe água precisa de caimento mínimo de 1% para os ralos e de teste de estanqueidade.',opts:[
  O('imp2nada','Só cerâmica e rejunte','Nenhuma camada impermeável: confia no revestimento.',[10,10,1,2,_],'Rejunte não é impermeável. A água passa para a parede e o contrapiso e aparece como mofo e manchas.',true),
  O('imp2polim','Argamassa polimérica nas áreas molhadas','Box, banheiros e área de serviço com subida de 30 cm nas paredes.',[7,7,7,7,_],'Boa para áreas frias internas. Rígida demais para laje exposta ao sol.'),
  O('imp2memb','Membrana acrílica/PU com estruturante','Película elástica nas áreas molhadas e na laje, com reforço nos ralos.',[5,8,7,6,_],'Sem emendas, ótima para ralos e cantos. A membrana acrílica reflete o sol na laje.'),
  O('imp2manta','Manta asfáltica + proteção mecânica','Manta aderida a maçarico, subindo 30 a 40 cm nos planos verticais.',[4,5,9,8,_],'Sistema mais robusto para laje e calhas. Exige proteção mecânica e teste com lâmina d’água por 72 h.'),
  O('imp2completo','Sistema completo com teste de 72 h','Membrana nas áreas internas, manta na cobertura, reforço de ralos e teste de estanqueidade.',[3,4,10,9,_],'O mais caro, mas cada área recebe o sistema adequado e tudo é testado antes do revestimento.')
 ]},
 {id:'rev',name:'Revestimento de argamassa',short:'Reboco',desc:'Camadas que protegem a vedação e regularizam a base para o acabamento. Respondem por boa parte da estanqueidade da parede.',opts:[

  O('massaunica','Chapisco + massa única','Uma camada de argamassa sobre o chapisco, sarrafeada e desempenada.',[7,6,8,7,6],'Taliscas e mestras a cada 1,5 a 2 m garantem prumo e planeza.'),
  O('projetada','Argamassa projetada','Argamassa lançada por bomba e projetor mecânico.',[5,9,8,8,7],'Produtividade bem maior que a aplicação manual. Exige equipamento e equipe treinada.'),

 ]},

 ]},
 {id:'jan',name:'Esquadrias',short:'Janelas',desc:'Janelas controlam luz, ventilação, água, ar, ruído e intrusos (NBR 10821). A maioria dos defeitos de funcionamento está nas ferragens.',opts:[
  O('aluvidro','Alumínio de correr com vidro','Duas folhas de correr em alumínio anodizado.',[7,8,8,8,6],'Simples e com ventilação regulável, mas abre só metade do vão. A anodização reforça a resistência à corrosão.'),

  O('pvc','PVC com vidro duplo','Perfis de PVC com vidro insulado.',[3,7,9,9,8],'Janela acústica: perfis espessos, caixilho sem frestas e vidro especial. Custo e prazo maiores.'),

 ]},

  O('porc','Porcelanato','Placa de absorção até 0,5%, juntas mínimas.',[4,5,9,8,9],'Argamassa AC-III e dupla colagem em peças acima de 900 cm². Polido escorrega em área molhada.'),

 {id:'par',name:'Acabamento de paredes',short:'Acabam.',desc:'Pintura ou revestimento colado: protege a parede e define o visual da casa.',opts:[
  O('pva','Pintura látex PVA','Tinta à base de água, acabamento fosco, sobre massa corrida.',[10,8,3,3,5],'Só para áreas internas secas. Mancha e não aceita lavagem.'),
  O('acril','Pintura acrílica','Tinta acrílica lavável, versátil e de secagem rápida.',[8,8,6,6,7],'Serve para áreas internas e externas. Repintura a cada poucos anos.'),
  O('textura','Textura ou grafiato','Massa texturizada aplicada com rolo ou desempenadeira.',[7,7,7,6,7],'Tendência de mercado. Disfarça imperfeições, mas acumula sujeira na fachada.'),

 ]}

function fundFails(ch){
  if(!ch.fund) return null;
  if(ch.terra==='aterrosolto'&&['sapata','radier','broca'].includes(ch.fund)) return 'Fundação rasa sobre aterro sem compactação';
  if(soilHidden(ch)) return null;
  const m=SOILS[soilOf(ch)].mods[ch.fund];
  return (m&&m.d<=-3)?'Fundação inadequada ao solo do lote':null;
}
function deps(sid,oid,ch){
  const out=[];
  const ff=['est','ved','rev','jan','piso','par'].includes(sid)?fundFails(ch):null;
  if(ff){
    if(sid==='est') out.push({d:-2,m:-1,w:`${ff}: vigas e pilares fissuraram com o recalque.`});
    if(sid==='jan') out.push({d:-1,m:-1,w:`${ff}: com o recalque, portas e janelas emperram.`});
    if(sid==='ved') out.push({d:-3,m:-2,w:`${ff}: recalques diferenciais trincaram as paredes.`});
    if(sid==='rev'&&oid!=='semrev') out.push({d:-2,m:-1,w:`${ff}: as trincas da alvenaria passaram para o reboco.`});
    if(sid==='piso') out.push({d:-2,m:-1,w:`${ff}: o contrapiso trincou e o piso descolou em alguns pontos.`});
    if(sid==='par') out.push({d:-2,m:-1,w:`${ff}: as fissuras voltam a aparecer depois de cada repintura.`});
  }
  if(sid==='terra'&&ch.sond==='visual') out.push({d:-2,w:'Sem levantamento topográfico, cortes, aterros e locação foram estimados no olho.'});
  if(sid==='fund'){
    if(ch.sond==='visual') out.push({d:-2,w:'Sem sondagem, esta fundação foi escolhida no escuro.'});
    else if(ch.sond==='sptmin') out.push({d:-1,w:'Um furo só pode esconder variações do solo no lote.'});
    else if(ch.sond==='completo') out.push({i:'Sondagem, topografia e laudo completos: escolha feita com dados.'});
    if(ch.terra==='aterrosolto'){
      if(['sapata','radier','broca'].includes(oid)) out.push({d:-3,w:'Fundação rasa sobre aterro sem compactação: recalque.'});
      else out.push({d:-1,w:'Estacas que atravessam aterro em adensamento sofrem atrito negativo.'});
    }
  }
  if(sid==='cob'&&oid==='verde'&&(ch.est==='madeira'||ch.est==='lsf'))
    out.push({d:-2,w:'Estrutura leve: confira se ela suporta o peso do substrato encharcado.'});
  if(sid==='ved'&&ch.est==='alvest')
    out.push({i:'Com alvenaria estrutural, esta vedação vale para as paredes internas.'});
  if(sid==='hid'&&oid==='kitshaft'&&ch.ved==='drywall')
    out.push({t:1,g:'Drywall e kits hidráulicos combinam bem: parede hidráulica pré-montada.'});
  if(sid==='pluv'){
    if(oid==='semcalha'&&(ch.cob==='laje'||ch.cob==='verde')) out.push({d:-4,w:'Laje com platibanda precisa de calha e condutor: sem eles a água empoça na cobertura.'});
    if(oid==='pluvesgoto'&&ch.hid==='fossa') out.push({d:-3,w:'Chuva na fossa: ela transborda a cada temporal.'});
  }
  if(sid==='imp2'){
    const laje=ch.cob==='laje'||ch.cob==='verde';
    if(laje&&(oid==='imp2nada'||oid==='imp2polim')) out.push({d:-3,m:-2,w:'Sua cobertura é laje: este sistema não protege laje exposta ao sol e à chuva.'});
    if(ch.cob==='verde'&&oid!=='imp2manta'&&oid!=='imp2completo') out.push({d:-2,w:'Telhado verde pede manta antirraiz.'});
    if(!laje&&(oid==='imp2manta')) out.push({p:-1,w:'Seu telhado é inclinado: manta só nas áreas molhadas sai caro para o que protege.'});
  }
  if(sid==='rev'){
    if(ch.ved==='drywall'){
      if(oid==='semrev') out.push({d:4,m:4,e:3,g:'Drywall dispensa reboco: vai direto para massa e pintura.'});
      else out.push({p:-2,w:'Drywall não leva argamassa: essa camada é gasto sem função.'});
    }
    if(oid==='semrev'&&ch.ved==='eco') out.push({d:2,m:1,e:3,g:'Tijolo ecológico pode ficar aparente, protegido com resina.'});
  }
  if(sid==='forro'){
    if(oid==='semforro'&&ch.cob==='fibro') out.push({e:-2,w:'Fibrocimento sem forro: muito calor e visual de galpão.'});
    if(oid==='semforro'&&(ch.cob==='laje'||ch.cob==='verde')) out.push({e:2,g:'Laje aparente dispensa forro: visual industrial.'});
  }
  if(sid==='piso'){
    if(['madeirapiso','vinil','laminado'].includes(oid)&&ch.imp==='impnada') out.push({d:-2,w:'Sem impermeabilização no baldrame, a umidade do contrapiso estraga este piso.'});
    if(oid==='porc'&&ch.imp2==='imp2nada') out.push({d:-1,w:'Sem impermeabilização nas áreas molhadas, a água passa pelo rejunte.'});
  }
  if(sid==='par'){
    if(PAINT.includes(oid)&&ch.imp==='impnada') out.push({d:-2,m:-1,w:'Sem impermeabilização no baldrame, a umidade sobe e estufa a pintura.'});
    if((oid==='parceram'||oid==='parporc')&&ch.rev==='gessoliso') out.push({d:-3,w:'Cerâmica não deve ser colada sobre gesso: precisa de emboço como base.'});
    if((oid==='parceram'||oid==='parporc')&&ch.rev==='semrev'&&ch.ved!=='drywall') out.push({d:-2,w:'Cerâmica direto no bloco, sem emboço: base irregular e aderência fraca.'});
    if(PAINT.includes(oid)&&ch.rev==='semrev'&&!['drywall','eco'].includes(ch.ved)) out.push({d:-2,w:'Pintura direto no bloco: base porosa e irregular.'});
    if((oid==='parceram'||oid==='parporc')&&ch.ved==='drywall') out.push({d:-1,w:'Cerâmica sobre drywall exige placa RU e reforço na estrutura.'});
  }
  return out;
}

function evalOpt(sid,oid,ch,sk){
  const o=OPT(sid,oid); const base=o.v.slice(); const vals=base.slice(); const notes=[];
  if(o.note) notes.push({t:o.note,kind:o.alert?'warn':'info',src:o.alert?'Atenção':null});
  const apply=(mod,src)=>{
    if(!mod) return;
    IDX.forEach((ix,i)=>{ if(mod[ix.k]!=null&&vals[i]!=null) vals[i]=clamp(vals[i]+mod[ix.k]); });
    if(mod.w) notes.push({t:mod.w,kind:'warn',src});
    if(mod.g) notes.push({t:mod.g,kind:'good',src});
    if(mod.i) notes.push({t:mod.i,kind:'info',src});
  };
  const sc=SCEN[sk]; if(sc) apply(sc.mods[oid],'Região');
  if(!soilHidden(ch)) apply(SOILS[soilOf(ch)].mods[oid],'Solo');
  deps(sid,oid,ch).forEach(d=>apply(d,'Sua obra'));
  gctx().ev.forEach(id=>{ const E=EVM[id]; if(!E||!ch[E.after]) return; E.check(ch).filter(x=>x.s===sid).forEach(x=>apply(x,'Imprevisto')); });
  return {o,base,vals,notes};
}

function score(ch,sk){
  const sums=[0,0,0,0,0],cnt=[0,0,0,0,0]; let n=0;
  STAGES.forEach(st=>{
    const oid=ch[st.id]; if(!oid) return; n++;
    evalOpt(st.id,oid,ch,sk).vals.forEach((v,i)=>{ if(v!=null){sums[i]+=v;cnt[i]++;} });
  });
  if(!n) return {n:0,avg:[null,null,null,null,null],nota:null,mean:null,sd:null,min:null};
  const avg=sums.map((s,i)=>cnt[i]?s/cnt[i]:null);
  const a=avg.filter(v=>v!=null);
  const W=CLIENTS[gctx().cli].w;
  const pr=avg.map((v,i)=>v==null?null:[v,W[i]]).filter(Boolean);
  const sw=pr.reduce((x,p)=>x+p[1],0);
  const mean=pr.reduce((x,p)=>x+p[0]*p[1],0)/sw;
  const sd=Math.sqrt(pr.reduce((x,p)=>x+p[1]*(p[0]-mean)**2,0)/sw);
  const pen=sd/2; return {n,avg,mean,sd:pen,nota:mean-pen,min:Math.min(...a)};
}

  if(S.mode==='local'&&S.screen!=='setup') return {cli:CLIENTS[S.cli]?S.cli:'equil',ev:(S.ev||[]).filter(id=>EVM[id])};
  return {cli:CLIENTS[S.cliPick]?S.cliPick:'equil',ev:[]};

function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function drawEvents(seed,n){
  const r=seeded(String(seed)); const pool=EVENTS.map(e=>e.id);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const idx=id=>STAGES.findIndex(s=>s.id===EVM[id].after);
  const out=[],used=new Set();
  pool.forEach(id=>{ if(out.length<(n||4)&&!used.has(EVM[id].after)){ out.push(id); used.add(EVM[id].after); } });
  return out.sort((a,b)=>idx(a)-idx(b));
}

/* ---------- utilidades da turma ---------- */
function cleanCh(ch){
  const o={};
  if(ch&&typeof ch==='object'){ STAGES.forEach(st=>{ const v=ch[st.id]; if(typeof v==='string'&&st.opts.some(x=>x.id===v)) o[st.id]=v; }); if(SOILS[ch.solo]) o.solo=ch.solo; }
  return o;
}
const firstOpen=ch=>{ const i=STAGES.findIndex(s=>!ch[s.id]); return i<0?STAGES.length:i; };
const myDoc=()=>CL.players.find(p=>p.id===CL.uid);
function roundPlayers(){
  const L=CL.live; if(!L||!L.round) return [];
  return CL.players.filter(p=>p.round===L.round).map(p=>{
    const ch=cleanCh(p.ch); const sc=score(ch,L.scen);
    return {id:p.id,nick:String(p.nick||'Aluno').slice(0,24),ch,n:sc.n,sc,done:sc.n===STAGES.length};
  }).sort((a,b)=>(b.done-a.done)||((b.sc.nota??-99)-(a.sc.nota??-99))||((b.sc.min??0)-(a.sc.min??0))||(b.n-a.n));
}
function classAvg(rp){
  const live=rp.filter(r=>r.n>0); if(!live.length) return null;
  return IDX.map((_,i)=>{ const v=live.map(r=>r.sc.avg[i]).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; });
}
const STATUS_LABEL={lobby:'Sala aberta',playing:'Obra em andamento',closed:'Rodada encerrada',none:'Sem rodada'};
const timers={};
function schedule(key,fn,ms){ if(timers[key]) return; timers[key]=setTimeout(()=>{timers[key]=null;fn();},ms||350); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{t.hidden=true;},4000); }

/* ---------- prancha (esquerda) ---------- */
function boardData(){
  if(S.mode==='connecting'||(S.mode==='local'&&S.screen==='setup'))
    return {ch:DEMO,name:'Exemplo',idx:null,sk:SCEN_KEYS.includes(S.scenPick)?S.scenPick:'urbano',demo:true};
  if(S.mode==='student'){
    const p=S.players[0];
    return {ch:p?p.ch:{},name:p?p.name:(S.nick||'Sua casa'),idx:p?0:null,sk:(CL.live&&SCEN[CL.live.scen])?CL.live.scen:'urbano'};
  }
  const p=S.players[S.view]||S.players[0];
  return {ch:p.ch,name:p.name,idx:S.view,sk:S.scen};
}
function renderBoard(){
  const el=$('#board');
  const hide=S.mode==='teacher'||S.mode==='prof'||S.mode==='home'||(S.mode==='local'&&S.screen==='setup'&&window.matchMedia&&window.matchMedia('(max-width:880px)').matches);
  el.hidden=hide; $('#main').classList.toggle('solo',hide);
  if(hide) return;
  const b=boardData();
  let pv=null,fresh=null;
  if(S.screen==='play'&&S.sel&&b.idx===S.turn) pv={stage:STAGES[S.stage].id,opt:S.sel};
  if(S.fresh&&S.fresh.p===b.idx) fresh=S.fresh.s;
  S.fresh=null;
  const sc=score(b.ch,b.sk);

/* ---------- códigos (rodada e resultado, para quem entra pelo link público) ---------- */
const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const packBits=f=>f.reduce((n,[v,b])=>(n<<BigInt(b))|BigInt(v),0n);
function hashBits(n,bits){ let h=2166136261>>>0; for(const c of n.toString(36)) h=Math.imul(h^c.charCodeAt(0),16777619)>>>0; return h&((1<<bits)-1); }
function toB32(n,len){ let s=''; for(let i=0;i<len;i++){ s=B32[Number(n&31n)]+s; n>>=5n; } return s; }
function fromB32(str){ let n=0n; for(const c of str){ const i=B32.indexOf(c); if(i<0) return null; n=(n<<5n)|BigInt(i); } return n; }
const normCode=t=>String(t||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
function roundBits(sk,cli,ev){
  const r=Math.max(0,SCEN_KEYS.indexOf(sk)), c=Math.max(0,CLI_KEYS.indexOf(cli));
  const m=EVENTS.reduce((a,e,i)=>a|((ev||[]).includes(e.id)?1<<i:0),0);
  return packBits([[r,2],[c,3],[m,10]]);
}
function roundCode(sk,cli,ev){ const p=roundBits(sk,cli,ev); return toB32((p<<5n)|BigInt(hashBits(p,5)),4); }
function unpackRound(p){
  const m=Number(p&1023n), c=Number((p>>10n)&7n), r=Number((p>>13n)&3n);
  if(!SCEN_KEYS[r]||!CLI_KEYS[c]) return null;
  const idx=id=>STAGES.findIndex(s=>s.id===EVM[id].after);
  const ev=EVENTS.filter((e,i)=>m>>i&1).map(e=>e.id).sort((a,b)=>idx(a)-idx(b));
  return {scen:SCEN_KEYS[r],cli:CLI_KEYS[c],ev};
}
function decodeRound(txt){
  const t=normCode(txt); if(t.length!==4) return null;
  const n=fromB32(t); if(n==null) return null;
  const p=n>>5n; if(Number(n&31n)!==hashBits(p,5)) return null;
  const o=unpackRound(p); if(o) o.code=t; return o;
}
function resultCode(ch,sk,cli,ev){
  const f=[[roundBits(sk,cli,ev),15],[Math.max(0,SOIL_KEYS.indexOf(soilOf(ch))),2]];
  STAGES.forEach(st=>{ const i=st.opts.findIndex(o=>o.id===ch[st.id]); f.push([i<0?7:i,3]); });
  const p=packBits(f.map(([v,b])=>[v,b]));
  const raw=toB32((p<<10n)|BigInt(hashBits(p,10)),17);
  return raw.slice(0,6)+'-'+raw.slice(6,12)+'-'+raw.slice(12);
}
function decodeResult(txt){
  const t=normCode(txt); if(t.length!==17) return null;
  const n=fromB32(t); if(n==null) return null;
  const p=n>>10n; if(Number(n&1023n)!==hashBits(p,10)) return null;
  const ch={}; let q=p;
  for(let i=STAGES.length-1;i>=0;i--){ const v=Number(q&7n); q>>=3n; if(v!==7){ const o=STAGES[i].opts[v]; if(!o) return null; ch[STAGES[i].id]=o.id; } }
  const so=Number(q&3n); q>>=2n; ch.solo=SOIL_KEYS[so];
  const rd=unpackRound(q&32767n); if(!rd) return null;
  return {ch,round:rd,code:t};
}
function sheetURL(name,ch,sk,cli,ev,rcode){

function jsonp(url,ms){
  return new Promise((res,rej)=>{
    const cb='__oe'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const sc=document.createElement('script'); let fin=false;
    const end=(f,v)=>{ if(fin) return; fin=true; clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } sc.remove(); f(v); };
    window[cb]=d=>end(res,d);
    sc.onerror=()=>end(rej,new Error('load'));
    const t=setTimeout(()=>end(rej,new Error('timeout')),ms||20000);
    sc.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;
    document.head.appendChild(sc);
  });
}

const liveRoundCode=()=>{ const L=CL.live; return L&&L.round&&SCEN[L.scen]?roundCode(SCEN_KEYS.includes(L.scen)?L.scen:'urbano',gctx().cli,gctx().ev):''; };

  const L=CL.live; if(!L||!L.round){ msg.innerHTML='<span class="bad">Abra uma rodada antes de importar.</span>'; return; }
  const want=liveRoundCode(); const ok=[],bad=[];
  const lines=ta.value.split(/\n/).map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    let r=null, name=line;
    const toks=line.split(/[\s;,\t]+/).filter(Boolean);
    for(let k=1;k<=Math.min(4,toks.length)&&!r;k++){ const cand=toks.slice(-k).join(''); const d=decodeResult(cand); if(d){ r=d; name=toks.slice(0,-k).join(' '); } }
    if(!r){ bad.push(`${esc(line)}: código inválido`); continue; }
    if(roundCode(r.round.scen,r.round.cli,r.round.ev)!==want){ bad.push(`${esc(name||line)}: código de outra rodada`); continue; }
    const n=STAGES.filter(s=>r.ch[s.id]).length;
    try{ await CL.db.doc('players/imp-'+r.code).set({round:L.round,nick:(name||'Aluno').slice(0,24),ch:r.ch,n,done:n===STAGES.length,t:Date.now(),imp:true}); ok.push(name||'Aluno'); }
    catch(e){ bad.push(`${esc(name||line)}: não foi possível gravar`); }
  }
  msg.innerHTML=`${ok.length?`${ok.length} ${ok.length===1?'resultado importado':'resultados importados'}.`:''}${bad.length?`<br><span class="bad">${bad.join('<br>')}</span>`:''}`;
  if(ok.length&&!bad.length) ta.value='';
}

        const counts=stg.opts.map(o=>({o,c:rp.filter(r=>r.ch[stg.id]===o.id).length}));
        const max=Math.max(0,...counts.map(x=>x.c));
        return `<div class="panel chs"><h4>${stg.name}</h4>${tot?counts.map(x=>`<div class="cbar${x.c===max&&x.c>0?' lead':''}"><span>${x.o.name}</span><b>${pctTxt(x.c,tot)} (${x.c})</b><i><em style="width:${(x.c/tot*100).toFixed(0)}%"></em></i></div>`).join(''):'<p class="hint" style="margin:0">Ninguém chegou nesta etapa ainda.</p>'}</div>`;
      }).join('')}</div>`:''}`;
  }
  return `<div class="dash"><div class="dcol">${left}</div><div class="dcol">${right}</div></div>`;
}

/* ---------- página do professor (versão GitHub) ---------- */
function qrFor(text){
  try{
    if(typeof QRCode==='undefined') return '';
    const d=document.createElement('div');
    new QRCode(d,{text,width:480,height:480,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    const c=d.querySelector('canvas'); return c?c.toDataURL('image/png'):'';
  }catch(e){ return ''; }
}
function profGo(){
  const scen=SCEN_KEYS.includes(S.scenPick)?S.scenPick:SCEN_KEYS[Math.floor(Math.random()*SCEN_KEYS.length)];

  const ev=S.evOn?drawEvents(Date.now().toString(36)):[];
  const code=roundCode(scen,cli,ev); const link=ARTIFACT_URL+'?rodada='+code;
  S.prof={code,scen,cli,ev,link,qr:qrFor(link)}; S.live=null; S.liveErr='';
  try{ history.replaceState(null,'','?professor&rodada='+code); }catch(e){}

}
function profRestore(code){

let liveTimer=null;
function livePoll(){
  clearTimeout(liveTimer);

  const code=S.prof.code;
  jsonp(SHEETS_URL+'?'+qsOf({acao:'ranking',rodada:code}),15000)

function liveHTML(){

  const al=L.alunos||[], fin=al.filter(a=>a.status==='entregou').length;

  let pos=0;
  const rows=al.map(a=>{ const ok=a.status==='entregou'; if(ok) pos++; return `<tr><td class="n">${ok?pos+'º':''}</td><td>${esc(a.nome)}</td><td class="st${ok?' ok':''}">${ok?'entregou':'jogando'}</td><td class="nt">${ok?f2(a.nota):'—'}</td><td class="muted">${ok?esc(a.solo||''):''}</td></tr>`; }).join('');
  const chg=STAGES.map(stg=>{
    const c=(L.escolhas||{})[stg.id]||{}; const tot=stg.opts.reduce((x,o)=>x+(c[o.name]||0),0);
    const max=Math.max(0,...stg.opts.map(o=>c[o.name]||0));
    return `<div class="panel chs"><h4>${stg.name}</h4>${tot?stg.opts.map(o=>{ const n=c[o.name]||0; return `<div class="cbar${n===max&&n>0?' lead':''}"><span>${o.name}</span><b>${Math.round(n/tot*100)}% (${n})</b><i><em style="width:${(n/tot*100).toFixed(0)}%"></em></i></div>`; }).join(''):'<p class="hint" style="margin:0">Nenhuma obra entregue ainda.</p>'}</div>`;
  }).join('');
  return `${S.liveErr?`<p class="hint" style="color:var(--warn)">${S.liveErr}</p>`:''}
    <div class="stats"><div class="stat"><b>${al.length}</b><span>na sala</span></div><div class="stat"><b>${al.length-fin}</b><span>jogando</span></div><div class="stat"><b>${fin}</b><span>obras entregues</span></div></div>
    <div class="live-h"><h3>Alunos e notas</h3><span class="hint" style="margin:0">Atualiza sozinho a cada poucos segundos</span></div>
    ${al.length?`<div class="tbl"><table class="livetbl" style="min-width:0"><thead><tr><th class="n">Pos.</th><th>Nome</th><th>Status</th><th class="n">Nota</th><th>Solo</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="hint">Ninguém entrou ainda. Peça para escanearem o QR code.</p>'}
    <div class="live-h"><h3>Escolhas da turma</h3><span class="hint" style="margin:0">Entre as obras entregues</span></div>
    <div class="chgrid">${chg}</div>`;
}

  const d=$('#desk'); let h='';

  else if(S.mode==='prof') h=profHTML();

function render(){ renderTop(); renderBoard(); renderDesk(); autoSend(); }
function scrollDesk(){
  const d=$('#desk'); const top=d.getBoundingClientRect().top;
  if(top<0||top>window.innerHeight*0.6){
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- ações do jogo ---------- */
function startGame(){
  S.mode='local';
  S.scen=!SCEN_KEYS.includes(S.scenPick)?SCEN_KEYS[Math.floor(Math.random()*SCEN_KEYS.length)]:S.scenPick;
  S.n=1;
  S.players=S.names.slice(0,S.n).map((n,i)=>({name:(n||'').trim()||`Jogador ${i+1}`,ch:{solo:drawSoil()}}));
  S.cli=S.cliPick==='sortear'?CLI_KEYS[Math.floor(Math.random()*CLI_KEYS.length)]:S.cliPick;
  S.ev=S.evOn?drawEvents(Date.now()):[]; S.evNow=null;
  if(S.rc){ S.scen=S.rc.scen; S.cli=S.rc.cli; S.ev=S.rc.ev.slice(); }
  S.stage=0; S.turn=0; S.sel=null; S.view=0; S.fresh=null; S.screen='play';
  render(); scrollDesk();
}
function selectOpt(oid){
  if(S.screen!=='play') return;
  S.sel=oid;
  document.querySelectorAll('.card').forEach(c=>{
    const on=c.dataset.opt===oid;
    c.classList.toggle('sel',on); c.setAttribute('aria-checked',on);
    const b=c.querySelector('.badge');
    if(on&&!b) c.querySelector('.ch').insertAdjacentHTML('beforeend','<span class="badge">Selecionado</span>');
    if(!on&&b) b.remove();
  });
  $('#confirm').innerHTML=confirmInner();
  if(S.view!==S.turn){ S.view=S.turn; renderTop(); }
  renderBoard();
}
function confirmPick(){
  if(!S.sel) return;
  if(S.mode==='student'){
    if(CL.live&&CL.live.status==='closed'){ S.screen='done'; render(); return; }
    const st=STAGES[S.stage];
    S.players[0].ch[st.id]=S.sel; S.sel=null; S.fresh={p:0,s:st.id}; S.stage++;
    saveMine();
    const E=gctx().ev.map(id=>EVM[id]).find(e=>e.after===st.id);
    if(st.id==='sond'){ S.evNow='__boletim'; S.screen='event'; }
    else if(E){ S.evNow=E.id; S.screen='event'; }
    else if(S.stage>=STAGES.length) S.screen='done';
    render(); scrollDesk(); return;
  }
  clearTimeout(tmr);
  const st=STAGES[S.stage], who=S.turn;
  S.players[who].ch[st.id]=S.sel; S.sel=null;
  S.fresh={p:who,s:st.id};
  S.turn++;
  S.view=who;
  if(S.turn>=S.players.length){
    S.turn=0; S.stage++;
    const E=gctx().ev.map(id=>EVM[id]).find(e=>e.after===st.id);
    if(st.id==='sond'){ S.evNow='__boletim'; S.screen='event'; S.view=0; render(); scrollDesk(); return; }
    if(E){ S.evNow=E.id; S.screen='event'; render(); scrollDesk(); return; }
  }
  if(S.stage>=STAGES.length){ finishLocal(); return; }
  render();
  if(S.players.length>1) tmr=setTimeout(()=>{ if(S.screen==='play'){ S.view=S.turn; renderTop(); renderBoard(); } },1300);
  if(S.turn===0) scrollDesk();
}

function finishLocal(){
  S.screen='end';
  const res=S.players.map((p,i)=>Object.assign({i},score(p.ch,S.scen))).sort((a,b)=>(b.nota-a.nota)||(b.min-a.min));
  S.view=res[0].i; S.fresh=null;
  render(); scrollDesk();
}
function evContinue(){
  S.evNow=null;
  if(S.mode==='student'){ S.screen=S.stage>=STAGES.length?'done':'play'; S.sel=null; render(); route(); scrollDesk(); return; }
  if(S.stage>=STAGES.length){ finishLocal(); return; }
  S.screen='play'; S.view=S.turn; render(); scrollDesk();
}

/* ---------- sala da turma (dados compartilhados) ---------- */
let wq=Promise.resolve();
function saveMine(){
  const p=S.players[0], L=CL.live; if(!p||!L||!CL.db) return Promise.resolve();
  const n=STAGES.filter(s=>p.ch[s.id]).length;
  const body={round:S.joinedRound||L.round,nick:p.name,ch:Object.assign({},p.ch),n,done:n===STAGES.length,t:Date.now()};
  const ref=CL.db.doc('players/'+CL.uid);
  const job=wq.catch(()=>{}).then(()=>ref.set(body).catch(e=>{
    if(e&&e.code==='unavailable') return new Promise(r=>setTimeout(r,700+Math.random()*800)).then(()=>ref.set(body));
    throw e;
  }));
  wq=job;
  job.catch(()=>{ if(S.mode==='student'&&S.screen!=='join'&&S.screen!=='denied') toast('Não foi possível salvar sua escolha. Verifique a conexão.'); });
  return job;
}
async function joinRound(){
  const inp=$('#nick'); const nick=(inp?inp.value:'').trim().slice(0,24);
  if(!nick){ const m=$('#joinmsg'); if(m) m.textContent='Digite um nome para aparecer no ranking.'; if(inp) inp.focus(); return; }
  const L=CL.live; if(!joinOpen()) return;
  const btn=$('#joinbtn'); if(btn) btn.disabled=true;
  S.nick=nick;
  S.players=[{name:nick,ch:{solo:drawSoil()}}]; S.stage=0; S.turn=0; S.view=0; S.sel=null; S.scen=L.scen;
  try{ await saveMine(); }
  catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){ S.screen='denied'; S.players=[]; render(); return; }
    if(btn) btn.disabled=false; const m=$('#joinmsg'); if(m) m.textContent='Não foi possível entrar agora. Tente de novo.'; return;
  }
  S.joinedRound=L.round;
  route();
}
function route(){
  if(S.mode!=='student'||S.screen==='denied') return;
  if(S.screen==='event'){ renderTop(); return; }
  const L=CL.live; const mine=myDoc();
  let target;
  if(!L||!L.round) target='join';
  else{
    if(S.joinedRound!==L.round&&mine&&mine.round===L.round){
      S.joinedRound=L.round; S.nick=String(mine.nick||'Aluno').slice(0,24);
      S.players=[{name:S.nick,ch:cleanCh(mine.ch)}]; S.stage=firstOpen(S.players[0].ch); S.turn=0; S.view=0; S.sel=null; S.scen=L.scen;
    }
    if(S.joinedRound!==L.round) target='join';
    else if(L.status==='closed'||S.stage>=STAGES.length) target='done';
    else if(L.status==='playing') target='play';
    else target='wait';
  }
  if(target!==S.screen){
    if(target==='join'){ S.players=[]; S.joinedRound=null; }
    if(target==='play'){ S.scen=L.scen; S.sel=null; }
    S.screen=target; render(); if(target!=='join') scrollDesk(); return;
  }
  renderTop();
  if(target==='wait') renderDesk();
  else if(target==='join') updateJoin();
  else if(target==='done') schedule('rank',()=>{ const el=$('#classrank'); if(el) el.innerHTML=classRankHTML(); const c=$('#mycmp'); if(c&&S.players[0]){ const o=c.querySelector('details'); c.innerHTML=choiceCmpHTML(S.players[0].ch,choiceStats(roundPlayers()),'Suas escolhas e a turma',!o||o.open); } },400);
}
async function setLive(patch){
  const L=Object.assign({},CL.live||{},patch,{t:patch.round?Date.now():((CL.live&&CL.live.t)||Date.now())});
  try{ await CL.db.doc('live/state').set(L); }
  catch(e){ toast('Não foi possível atualizar a rodada. Tente de novo.'); }
}
function newRound(){
  const scen=!SCEN_KEYS.includes(S.scenPick)?SCEN_KEYS[Math.floor(Math.random()*SCEN_KEYS.length)]:S.scenPick;
  S.focus=null;
  const cli=S.cliPick==='sortear'?CLI_KEYS[Math.floor(Math.random()*CLI_KEYS.length)]:S.cliPick;
  const round=Date.now().toString(36);
  setLive({round,scen,status:'lobby',cli,ev:S.evOn?drawEvents(round):[]});
}
function setMode(m){
  if(m===S.mode) return;
  clearTimeout(tmr); S.sel=null;
  if(m==='local'){ S.mode='local'; S.screen='setup'; }
  else if(m==='teacher'){ S.mode='teacher'; S.screen='dash'; }
  else { S.mode='student'; S.screen='join'; S.players=[]; S.joinedRound=null; }
  render(); if(S.mode==='student') route();
}
function goSolo(){
  S.mode='local'; S.screen='setup'; S.n=1; S.names[0]=S.nick||CL.myName||'Jogador 1';
  if(!S.rc&&CL.live&&CL.live.round){ const d=decodeRound(liveRoundCode()); if(d) S.rc=d; }
  render(); scrollDesk();
}
function afterSnap(){
  if(!(CL.gotLive&&CL.gotPlayers)) return;
  if(S.mode==='connecting'){
    S.mode=CL.owner?'teacher':'student'; S.screen=CL.owner?'dash':'join';
    render(); if(S.mode==='student') route(); return;
  }
  if(S.mode==='teacher') schedule('dash',()=>{ if(S.mode==='teacher'){ const ta=$('#impcodes'), im=$('#impmsg'); const keep=ta?ta.value:'', km=im?im.innerHTML:'', foc=document.activeElement&&document.activeElement.id==='impcodes'; renderTop(); renderDesk(); const t2=$('#impcodes'), m2=$('#impmsg'); if(t2){ t2.value=keep; if(foc) t2.focus(); } if(m2) m2.innerHTML=km; } },400);
  else if(S.mode==='student') route();
}
function classOff(){
  CL.state='off';
  if(S.mode!=='local'&&S.mode!=='prof'&&S.mode!=='home'){ S.mode='local'; S.screen='setup'; }
  render();
}
async function initClass(){
  if(!HAS_CLAUDE){ classOff(); return; }
  let db=null,user=null;
  try{ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); }catch(e){}
  if(!db||!user){ classOff(); return; }
  let me=null; try{ me=await user.me(); }catch(e){}
  if(!me||!me.id){ classOff(); return; }
  CL.db=db; CL.user=user; CL.uid=me.id; CL.owner=!!me.isOwner; CL.myName=me.name||''; CL.state='on';
  const onErr=()=>{ toast('A conexão com a sala caiu. Recarregue a página para tentar de novo.'); };
  try{
    db.doc('live/state').onSnapshot(s=>{ CL.live=s.exists?s.data():null; CL.gotLive=true; afterSnap(); },onErr);
    db.collection('players').onSnapshot(q=>{ CL.players=q.docs.map(d=>Object.assign({},d.data(),{id:d.id})); CL.gotPlayers=true; afterSnap(); },onErr);
  }catch(e){ classOff(); }
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const act=t.closest('[data-act]');
  if(act){ const a=act.dataset.act;
    if(a==='start'||a==='again') startGame();
    else if(a==='confirm') confirmPick();
    else if(a==='setup'){ S.screen='setup'; clearTimeout(tmr); render(); scrollDesk(); }
    else if(a==='solo') goSolo();
    else if(a==='toclass') setMode(CL.owner?'teacher':'student');
    else if(a==='local-now'){ S.mode='local'; S.screen='setup'; render(); }
    else if(a==='newround') newRound();
    else if(a==='go') setLive({status:'playing'});
    else if(a==='close') setLive({status:'closed'});
    else if(a==='evcont') evContinue();
    else if(a==='profgo') profGo();
    else if(a==='goprof'){ S.mode='prof'; S.screen='prof'; try{ history.replaceState(null,'','?professor'); }catch(e){} render(); }
    else if(a==='goaluno'){ S.mode='local'; S.screen='setup'; render(); }
    else if(a==='userc'){ const v=($('#rcode')||{}).value||''; const d=decodeRound(v); const m=$('#rcmsg'); if(!d){ if(m) m.innerHTML='<span style="color:var(--warn)">Código não reconhecido. Confira as 4 letras e números com o professor.</span>'; return; } S.rc=d; S.rcode=d.code; renderDesk(); renderBoard(); }
    else if(a==='clearrc'){ S.rc=null; S.rcode=''; renderDesk(); }
    else if(a==='import') importCodes();
    else if(a==='copy'){
      try{ navigator.clipboard.writeText(ARTIFACT_URL).then(()=>toast('Link copiado.'),()=>selectUrl()); }catch(err){ selectUrl(); }
    }
    return; }
  const md=t.closest('[data-mode]'); if(md){ setMode(md.dataset.mode); return; }
  const n=t.closest('[data-n]'); if(n){ S.n=+n.dataset.n; renderDesk(); return; }
  const sc=t.closest('[data-scen]'); if(sc){ S.scenPick=sc.dataset.scen; document.querySelectorAll('[data-scen]').forEach(b=>b.setAttribute('aria-pressed',b===sc)); if(S.mode==='local') renderBoard(); return; }
  const cl=t.closest('[data-cli]'); if(cl){ S.cliPick=cl.dataset.cli; document.querySelectorAll('[data-cli]').forEach(b=>b.setAttribute('aria-pressed',b===cl)); if(S.mode==='local') renderBoard(); return; }
  const eo=t.closest('[data-evon]'); if(eo){ S.evOn=eo.dataset.evon==='1'; document.querySelectorAll('[data-evon]').forEach(b=>b.setAttribute('aria-pressed',b===eo)); return; }
  const op=t.closest('[data-opt]'); if(op){ selectOpt(op.dataset.opt); return; }
  const f=t.closest('[data-focus]'); if(f){ S.focus=f.dataset.focus; renderDesk(); return; }
  const v=t.closest('[data-view]'); if(v){ clearTimeout(tmr); S.view=+v.dataset.view; renderTop(); renderBoard(); return; }
});
function selectUrl(){ const u=$('#url'); if(!u) return; const r=document.createRange(); r.selectNodeContents(u); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecionei o link: copie com Ctrl+C.'); }
document.addEventListener('submit',e=>{ if(e.target.id==='joinform'){ e.preventDefault(); joinRound(); } if(e.target.id==='soloform'){ e.preventDefault(); soloStart(); } });
document.addEventListener('keydown',e=>{
  const c=e.target.closest&&e.target.closest('.card');
  if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); if(S.sel===c.dataset.opt&&e.key==='Enter') confirmPick(); else selectOpt(c.dataset.opt); }
});
document.addEventListener('input',e=>{
  const i=e.target.dataset&&e.target.dataset.name; if(i!=null) S.names[+i]=e.target.value;
  if(e.target.id==='nick') S.nick=e.target.value;
  if(e.target.id==='rcode') S.rcode=e.target.value;
});

/* ---------- início (preserva a partida em atualizações da página) ---------- */
function start(data){
  try{
    const qs=new URLSearchParams(location.search);
    if(qs.has('professor')){ S.mode='prof'; S.screen='prof'; if(qs.get('rodada')) profRestore(qs.get('rodada')); }
    else if(qs.get('rodada')){ S.rcode=qs.get('rodada'); const d=decodeRound(S.rcode); if(d) S.rc=d; }
    else if(!HAS_CLAUDE){ S.mode='home'; S.screen='home'; }
  }catch(e){}
  if(data&&data.screen){ Object.assign(S,data); S.fresh=null; if(S.mode!=='local') S.mode=HAS_CLAUDE?S.mode:'local'; }
  render();
  initClass();
  if(S.mode==='prof'&&S.prof) livePoll();
}
window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S)));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
